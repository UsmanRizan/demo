name: Scheduled jobs

# Triggers /api/cron: expires unpaid holds, completes finished bookings,
# sends reminders and cleans up. Needs repository secrets APP_URL and
# CRON_SECRET. GitHub may delay scheduled runs by a few minutes under load;
# use Vercel Cron or another scheduler if you need tighter timing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not configured; skipping."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron"
